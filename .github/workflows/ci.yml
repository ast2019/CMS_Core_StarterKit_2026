name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # SQLite job — the fast feedback loop that mirrors local development.
  # ---------------------------------------------------------------------------
  tests-sqlite:
    name: Tests (SQLite)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # PHP 8.4 is the floor, not a preference: spatie/laravel-activitylog 5.x,
          # laravel-sitemap 8.x and schema-org 5.x all require ^8.4.
          php-version: '8.4'
          # gd is needed by Media Library conversions, which several tests exercise.
          extensions: mbstring, intl, gd, exif, pdo_sqlite, sqlite3, zip, bcmath
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan storage:link

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # MUST run before the tests. tests/Architecture/NoExternalCdnTest scans the BUILT
      # assets for external font and CDN hosts (RULE #4), and public/build is gitignored
      # — so without a build that test fails on a clean checkout, and the rule it guards
      # would look broken rather than unverified.
      - name: Build assets
        run: npm run build

      - name: Code style
        run: ./vendor/bin/pint --test

      - name: Static analysis
        run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Tests
        run: php artisan test

      # RULE #3 is gated by tests/Architecture/OpenApiSpecIsInSyncTest, inside the step
      # above — deliberately NOT repeated as a `diff` step here.
      #
      # A byte-exact diff in CI would fail on every release: the spec's info.version is
      # stamped from the `system_info` table, and a CI checkout has no released database,
      # so it reports the initial version while the committed file carries the real one.
      # The test compares the documented SHAPE and ignores that field for this reason.
      # Version freshness is an operational check (`php artisan cms:audit-rules`), run
      # against a real database at release/deploy time — see docs/deployment.md.
