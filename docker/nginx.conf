# Complete nginx configuration for the container. This REPLACES the distribution's
# /etc/nginx/nginx.conf, and deliberately does not include sites-enabled/ — the
# packaged default server would otherwise also listen on port 80 and answer some
# requests with the nginx welcome page.

user www-data;
worker_processes auto;
pid /run/nginx.pid;

# supervisord supervises this process, so nginx must stay in the foreground.
daemon off;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Must match (or exceed) post_max_size in docker/php.ini. Editors upload video, and
    # nginx rejects an oversized body before PHP ever sees it — producing a bare 413
    # with no Laravel validation message, which reads like a broken panel.
    client_max_body_size 68M;
    client_body_timeout 120s;

    # Container convention: logs go to the collector, not to files inside a writable
    # layer that nobody rotates.
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Sitemaps are generated XML, so gzip matters for them; images and video are
    # already compressed and re-compressing wastes CPU.

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        root /var/www/html/public;
        index index.php;
        charset utf-8;

        # ---------------------------------------------------------------------
        # RULE #9 — media is served straight off local disk.
        #
        # public/storage is a symlink into storage/app/public, which is a mounted
        # volume. No CDN and no object storage is involved, so this location is the
        # entire media delivery path for every client site.
        #
        # A long max-age is safe because Media Library names conversions by content:
        # an edited image gets a new path rather than overwriting the old one.
        # ---------------------------------------------------------------------
        location ^~ /storage/ {
            access_log off;
            # One header only: `expires` emits its own Cache-Control, so pairing the
            # two sent Cache-Control twice and left which one applied up to the client.
            add_header Cache-Control "public, max-age=31536000, immutable";

            # Never hand an upload to the PHP handler. Without this, a file named
            # evil.php dropped into the media library would be EXECUTED rather than
            # served — the classic upload-directory remote code execution.
            location ~ \.(?:php|phar|phtml)$ {
                deny all;
            }

            try_files $uri =404;
        }

        # Locally bundled Vazirmatn (RULE #4) and the Vite build. Both are immutable:
        # the fonts are versioned by the release, Vite hashes its filenames.
        location ^~ /fonts/ {
            access_log off;
            # One header only: `expires` emits its own Cache-Control, so pairing the
            # two sent Cache-Control twice and left which one applied up to the client.
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location ^~ /build/ {
            access_log off;
            # One header only: `expires` emits its own Cache-Control, so pairing the
            # two sent Cache-Control twice and left which one applied up to the client.
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ ^/index\.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;

            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;

            fastcgi_hide_header X-Powered-By;

            # Generous, because a video upload plus metadata extraction is legitimately
            # slow. Kept below php.ini's max_execution_time so PHP's own limit reports
            # the failure, with a stack trace, instead of nginx returning a bare 504.
            fastcgi_read_timeout 180;

            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        # Only /index.php is routed to PHP, above. Any other .php path is refused
        # rather than executed, so a PHP file that reaches the document root by any
        # means is inert.
        location ~ \.php$ {
            deny all;
        }

        # Dotfiles, except ACME challenges.
        location ~ /\.(?!well-known) {
            deny all;
            access_log off;
        }
    }
}
