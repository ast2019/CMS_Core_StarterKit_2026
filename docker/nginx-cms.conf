# Additions to serversideup/php's nginx configuration.
#
# Included last from /etc/nginx/server-opts.d/, inside the server block.
#
# Deliberately almost empty. The base image already provides what would otherwise be
# written here, and re-stating any of it would mean maintaining a second copy that
# silently drifts from the original:
#
#   - `location ~* ^/storage/.*\.php$ { deny all; }` — blocks execution of an uploaded
#     PHP file, the classic media-directory RCE;
#   - immutable, year-long caching for images, video, audio, CSS/JS and fonts;
#   - gzip, security headers, and denial of dotfiles and *.sql/*.log/*.bak.
#
# Note that only NEW directives and NEW location blocks can live here. nginx rejects a
# repeated `real_ip_header` or `gzip_types` in the same context as a duplicate rather
# than treating it as an override — so changing one of those means replacing the base
# file outright (see docker/nginx-remoteip.conf), and adding a compressible content type
# means choosing one the base image already lists (see SitemapController).

# ---------------------------------------------------------------------------
# Documents in the media library.
#
# The base image caches images, video and audio aggressively but not documents, so a PDF
# is re-downloaded in full on every visit. Media Library gives an edited file a new path
# rather than overwriting it, so `immutable` is accurate here.
#
# Safe as an addition: this is a new location, and it is more specific than the base
# image's asset rules, which do not match these extensions at all.
# ---------------------------------------------------------------------------
location ~* ^/storage/.*\.(?:pdf|docx?|xlsx?|pptx?|zip|csv)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
    try_files $uri =404;
}
