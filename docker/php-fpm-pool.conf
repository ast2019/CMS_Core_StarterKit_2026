; PHP-FPM pool overrides. Loaded after the image's www.conf, so these win.

[www]
user = www-data
group = www-data

; Loopback rather than a unix socket: nginx and php-fpm share this container, and a
; TCP listener means the pool config does not also have to manage socket ownership.
listen = 127.0.0.1:9000

; -----------------------------------------------------------------------------
; THE important line in this file.
;
; php-fpm wipes the environment of its worker processes by default, so every
; container environment variable — DB_PASSWORD, APP_KEY, REDIS_PASSWORD — would be
; invisible to PHP while remaining perfectly visible to `docker exec … env` and to
; `php artisan` on the command line.
;
; The failure that produces is genuinely confusing: artisan commands work, the queue
; worker works (it is a CLI process), and only web requests fail, with Laravel
; reporting no database password. Hours get lost to it.
;
; This application ships no .env file on purpose — configuration is environment, so
; the same image can be promoted between environments — which makes this line load
; bearing rather than a convenience.
; -----------------------------------------------------------------------------
clear_env = no

pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = ${PHP_FPM_START_SERVERS}
pm.min_spare_servers = ${PHP_FPM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${PHP_FPM_MAX_SPARE_SERVERS}

; Recycle workers periodically. Guards against a slow leak in a long-lived process
; turning into an OOM kill days after a deploy.
pm.max_requests = 500

; Send worker output to the container log instead of a file nobody will read.
catch_workers_output = yes
decorate_workers_output = no

; nginx already logs every request; a second copy is noise.
access.log = /dev/null

; Surface slow requests with a stack trace. The panel's media conversions are the
; usual cause, and without this they present only as "the page took ages".
request_slowlog_timeout = 15s
slowlog = /proc/self/fd/2
