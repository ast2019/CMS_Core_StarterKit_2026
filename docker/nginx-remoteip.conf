# REPLACES the base image's /etc/nginx/server-opts.d/remoteip.conf.
#
# Replaced rather than supplemented because nginx treats a second `real_ip_header` in the
# same context as a fatal duplicate, not as an override — adding a file alongside it
# fails the config with "directive is duplicate" and the container serves nothing.
#
# The image ships a Cloudflare-oriented version (`real_ip_header CF-Connecting-IP`).
# This deployment sits behind Coolify's Traefik, which sends X-Forwarded-For. With the
# stock file, nginx logs every request as coming from the proxy's container address.
#
# Cloudflare users are still covered: when Cloudflare fronts Coolify, Traefik receives
# CF-Connecting-IP and passes the client along in X-Forwarded-For, so reading XFF
# recursively yields the original visitor either way.
#
# Only private ranges are trusted. nginx believes the header exclusively when the TCP
# connection itself originated inside the Docker network, so a request arriving from the
# internet cannot forge its own address.
#
# Scope note: this governs nginx's ACCESS LOG. Laravel derives the client IP
# independently through its trusted-proxy configuration (bootstrap/app.php), and that is
# what the rate limiters and the audit trail use.

set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.0/8;
set_real_ip_from fc00::/7;
set_real_ip_from ::1/128;

real_ip_header X-Forwarded-For;

# The header is a chain (client, proxy1, proxy2…). Recursive walks it from the right,
# skipping addresses that are themselves trusted, so the result is the first address
# outside the trusted set — the real client.
real_ip_recursive on;
