; supervisord runs nginx and php-fpm as one unit inside the web container.
;
; Two processes in one container is a deliberate trade. The alternative — separate
; nginx and php-fpm containers — needs the application code in BOTH (nginx serves the
; static files itself), which means a shared volume or a duplicated image, and either
; one can drift. Keeping them together makes "the code nginx serves" and "the code PHP
; executes" the same thing by construction.
;
; The queue worker and scheduler are NOT here. They are separate services in
; docker-compose.yaml so they can be restarted, scaled and read independently — a
; worker crash-looping inside the web container would be invisible.

[supervisord]
nodaemon=true
user=root
pidfile=/run/supervisord.pid

; Supervisor's own log adds nothing: both children already write to the container's
; stdout/stderr.
logfile=/dev/null
logfile_maxbytes=0
loglevel=info

[program:php-fpm]
command=php-fpm --nodaemonize --force-stderr
autostart=true
autorestart=true
startretries=3

; php-fpm before nginx: if nginx binds first it will answer requests with 502 until
; the pool is listening, and a health check can pass on a container that cannot
; execute PHP.
priority=10

stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; A dead PHP pool means the container is useless, so take it down and let the
; orchestrator replace it rather than serving 502s indefinitely.
exitcodes=0
stopsignal=QUIT
stopwaitsecs=30

[program:nginx]
command=nginx
autostart=true
autorestart=true
startretries=3
priority=20

stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; QUIT lets nginx finish in-flight requests, which matters during a redeploy: an
; editor's upload should not be severed because a new image became available.
stopsignal=QUIT
stopwaitsecs=30
