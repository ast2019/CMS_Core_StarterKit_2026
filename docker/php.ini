; Runtime PHP configuration for the container image.

; -----------------------------------------------------------------------------
; Uploads.
;
; Editors upload video (blueprint §10), and PHP's 2M default rejects nearly all of it
; with a message that does not mention PHP. nginx's client_max_body_size is raised to
; match in docker/nginx.conf — both limits apply, and whichever is lower wins, so
; changing one alone achieves nothing.
; -----------------------------------------------------------------------------
upload_max_filesize = 64M
post_max_size = 68M
max_file_uploads = 30

; Image conversions are the memory-hungry part of this application: Media Library
; decodes an upload into a bitmap to produce thumbnail and WebP variants, and a large
; photograph exhausts the 128M default. The test suite needed the same raise in
; phpunit.xml for exactly this reason.
memory_limit = 512M

; Long enough for a video upload plus its metadata extraction; short enough that a
; wedged request is eventually reclaimed.
max_execution_time = 120
max_input_time = 120

; Persian content means multi-byte input everywhere; a form with many translatable
; fields across three locales can exceed the 1000-variable default.
max_input_vars = 5000

date.timezone = UTC

; -----------------------------------------------------------------------------
; Errors.
;
; Never rendered to the browser: a stack trace on a client's public site is an
; information leak. stderr goes to the container log, which is where an operator
; actually looks.
; -----------------------------------------------------------------------------
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Do not advertise the PHP version in response headers.
expose_php = Off

; -----------------------------------------------------------------------------
; OPcache.
; -----------------------------------------------------------------------------
opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16

; Filament generates a lot of small classes; the 10k default is too low for this
; dependency set and silently stops caching once exceeded.
opcache.max_accelerated_files = 20000

; The filesystem is immutable for the life of a container, so there is no point
; stat()-ing every file on every request.
;
; The consequence to remember: nothing written after php-fpm starts will ever be
; picked up. The entrypoint therefore writes the config, route and view caches BEFORE
; starting php-fpm, and any code change requires a new container — which is what a
; redeploy does anyway.
opcache.validate_timestamps = 0

opcache.save_comments = 1
opcache.enable_file_override = 0
